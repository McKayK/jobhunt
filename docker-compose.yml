services:
  jobhunt:
    build: .
    container_name: jobhunt
    restart: unless-stopped
    ports:
      - "3081:8081"
    volumes:
      - jobhunt-data:/data
    environment:
      HOME_ZIP: "${HOME_ZIP:-84042}"
      RADIUS_MILES: "${RADIUS_MILES:-30}"
      INCLUDE_REMOTE: "${INCLUDE_REMOTE:-1}"
      TITLE_INCLUDE: "${TITLE_INCLUDE:-}"
      TITLE_EXCLUDE: "${TITLE_EXCLUDE:-intern,internship,vice president,chief }"
      USER_AGENT: "${USER_AGENT:-jobhunt/0.3 (personal job search; contact: you@example.com)}"
      # Optional AI for resume tailoring. You can also paste keys in the app
      # (Resume -> AI); a key set here always wins.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

  # Windows has no host cron, so the schedule runs in its own container.
  # It calls the refresh endpoint at fixed local times. Default: 8 AM and
  # 8 PM Mountain, so the freshest batch is waiting each morning. Change
  # REFRESH_TIMES (24h HH:MM, comma-separated) and TZ in .env.
  scheduler:
    image: alpine:3.20
    container_name: jobhunt-cron
    restart: unless-stopped
    depends_on:
      - jobhunt
    environment:
      REFRESH_TIMES: "${REFRESH_TIMES:-08:00,20:00}"
      TZ: "${TZ:-America/Denver}"
    command: >
      sh -c "apk add --no-cache curl tzdata >/dev/null;
             echo \"scheduler up: refreshing at $$REFRESH_TIMES ($$TZ), now $$(date)\";
             last='';
             while true; do
               now=$$(date +%H:%M);
               case \",$$REFRESH_TIMES,\" in
                 *\",$$now,\"*)
                   if [ \"$$now\" != \"$$last\" ]; then
                     echo \"[$$(date)] refreshing\";
                     curl -s -m 60 -X POST http://jobhunt:8081/api/refresh || echo 'refresh failed';
                     echo;
                     last=$$now;
                   fi;;
               esac;
               sleep 20;
             done"

volumes:
  jobhunt-data:
